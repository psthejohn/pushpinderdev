<div class="contact-page">
  <div class="contact-header">
    <!-- <h1>Contact Me</h1> -->
    <h4>Connect and share your code thoughts.</h4>
  </div>

  <div class="contact-content">
    <form class="contact-form" (submit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your Name" [(ngModel)]="contact.name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com" [(ngModel)]="contact.email" name="email" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Your Message" [(ngModel)]="contact.message" name="message" required></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>

    <div class="contact-info">
      <div class="info-item">
        <h3>Email</h3>
        <p>programmerpushpinder@gmail.com</p>
      </div>
      <div class="info-item">
        <h3>Phone</h3>
        <p>+91 9610226367</p>
      </div>
      <div class="info-item">
        <h3>Address</h3>
        <p>Bengaluru, INDIA</p>
      </div>
    </div>
  </div>
</div>
